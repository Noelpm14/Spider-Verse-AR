<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <!-- Base mask shape — red oval -->
  <ellipse cx="200" cy="130" rx="192" ry="118" fill="#E62B2B"/>

  <!-- Web radial lines -->
  <g stroke="#111" stroke-width="2" fill="none" opacity="0.55">
    <line x1="200" y1="12"  x2="200" y2="248"/>
    <line x1="8"   y1="130" x2="392" y2="130"/>
    <line x1="58"  y1="30"  x2="342" y2="230"/>
    <line x1="342" y1="30"  x2="58"  y2="230"/>
    <line x1="28"  y1="80"  x2="372" y2="180"/>
    <line x1="372" y1="80"  x2="28"  y2="180"/>
    <line x1="130" y1="12"  x2="270" y2="248"/>
    <line x1="270" y1="12"  x2="130" y2="248"/>
  </g>

  <!-- Concentric web rings -->
  <g stroke="#111" stroke-width="1.5" fill="none" opacity="0.5">
    <ellipse cx="200" cy="130" rx="48"  ry="30"/>
    <ellipse cx="200" cy="130" rx="98"  ry="61"/>
    <ellipse cx="200" cy="130" rx="148" ry="92"/>
    <ellipse cx="200" cy="130" rx="185" ry="112"/>
  </g>

  <!-- Left eye (white, slightly angled) -->
  <ellipse cx="118" cy="100" rx="60" ry="40"
           fill="white"
           transform="rotate(-12 118 100)"/>
  <!-- Right eye -->
  <ellipse cx="282" cy="100" rx="60" ry="40"
           fill="white"
           transform="rotate(12 282 100)"/>

  <!-- Eye outlines (thick comic ink) -->
  <ellipse cx="118" cy="100" rx="60" ry="40"
           fill="none" stroke="#000" stroke-width="5"
           transform="rotate(-12 118 100)"/>
  <ellipse cx="282" cy="100" rx="60" ry="40"
           fill="none" stroke="#000" stroke-width="5"
           transform="rotate(12 282 100)"/>

  <!-- Mask outer border -->
  <ellipse cx="200" cy="130" rx="192" ry="118"
           fill="none" stroke="#000" stroke-width="5"/>
</svg>
