<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Dimension Not Found | Spider-Verse AR</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #0a0a0e;
      color: #fff;
      font-family: 'Comic Neue', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .error-card {
      background: #14141c;
      border: 4px solid #E62B2B;
      box-shadow: 12px 12px 0 #000;
      padding: 48px 36px;
      max-width: 550px;
      position: relative;
    }
    .glitch-code {
      font-family: 'Bangers', cursive;
      font-size: 7rem;
      color: #E62B2B;
      line-height: 1;
      margin: 0;
      text-shadow: 4px 4px 0 #000, -2px -2px 0 #00FFFF;
      letter-spacing: 4px;
      animation: glitch 1.8s infinite;
    }
    .error-title {
      font-family: 'Bangers', cursive;
      font-size: 2.2rem;
      color: #FFD600;
      margin: 16px 0;
      letter-spacing: 2px;
    }
    .error-desc {
      font-size: 1.15rem;
      color: #bbb;
      margin-bottom: 28px;
    }
    .return-btn {
      display: inline-block;
      padding: 12px 32px;
      background: #E62B2B;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-decoration: none;
      border: 3px solid #000;
      box-shadow: 6px 6px 0 #000;
      transition: all 0.2s;
    }
    .return-btn:hover {
      background: #FFD600;
      color: #000;
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #000;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <h1 class="glitch-code">404</h1>
    <h2 class="error-title">DIMENSIONAL TEAR DETECTED!</h2>
    <p class="error-desc">
      Looks like this universe doesn't exist or got glitched into another dimension by the Super-Collider.
    </p>
    <a href="index.html" class="return-btn">RETURN TO REALITY →</a>
  </div>
</body>
</html>
